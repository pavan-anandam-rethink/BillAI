# ============================================================================
# Docker Compose - k6 with Grafana + InfluxDB Monitoring Stack
# ============================================================================
# Provides a complete performance monitoring stack:
#   - k6:        Load testing engine
#   - InfluxDB:  Time-series metrics storage
#   - Grafana:   Real-time dashboards and visualization
#
# Usage:
#   docker compose up -d influxdb grafana   # Start monitoring stack
#   docker compose run k6 run /scripts/load-test.js -e CONCURRENCY=300
#   docker compose down                      # Tear down
#
# Grafana Dashboard: http://localhost:3000 (admin/admin)
# InfluxDB:          http://localhost:8086
# ============================================================================

services:
  # InfluxDB - Time-series database for k6 metrics
  influxdb:
    image: influxdb:1.8
    container_name: bh-billing-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_MAX_BODY_SIZE=0
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - perf-network

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: bh-billing-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - perf-network

  # k6 - Load testing engine
  k6:
    image: grafana/k6:latest
    container_name: bh-billing-k6
    working_dir: /scripts
    volumes:
      - ./:/scripts
      - ./results:/scripts/results
      - ./reports:/scripts/reports
    environment:
      - ENV=${ENV:-qa}
      - CONCURRENCY=${CONCURRENCY:-100}
      - K6_INFLUXDB_URL=http://influxdb:8086/k6
    depends_on:
      - influxdb
    networks:
      - perf-network

volumes:
  influxdb-data:
  grafana-data:

networks:
  perf-network:
    driver: bridge
