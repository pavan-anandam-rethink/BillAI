# Reusable Helm deploy template for BillingService AKS deployments.
# All environments (QA, Staging, Production) share this step sequence.
# Approval gates are enforced via Azure DevOps Environment protection rules,
# not inline in this template.

parameters:
- name: aksResourceGroup
  type: string
- name: aksClusterName
  type: string
- name: aksNamespace
  type: string
- name: helmReleaseName
  type: string
- name: helmChartPath
  type: string
- name: helmValuesFile
  type: string
- name: imageTag
  type: string
- name: acrLoginServer
  type: string
- name: imageRepository
  type: string

steps:
- task: AzureCLI@2
  displayName: 'Get AKS credentials'
  inputs:
    azureSubscription: 'azure-billing-subscription'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: >
      az aks get-credentials
      --resource-group ${{ parameters.aksResourceGroup }}
      --name ${{ parameters.aksClusterName }}
      --overwrite-existing

- task: HelmInstaller@1
  displayName: 'Install Helm'
  inputs:
    helmVersionToInstall: 'latest'

- script: |
    helm upgrade --install ${{ parameters.helmReleaseName }} ${{ parameters.helmChartPath }} \
      --namespace ${{ parameters.aksNamespace }} \
      --create-namespace \
      --values ${{ parameters.helmValuesFile }} \
      --set image.repository=${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }} \
      --set image.tag=${{ parameters.imageTag }} \
      --set deployment.buildId=$(Build.BuildId) \
      --wait \
      --timeout 10m \
      --atomic
  displayName: 'Helm Upgrade (Rolling Deploy)'

- script: |
    kubectl rollout status deployment/billingservice-web \
      --namespace ${{ parameters.aksNamespace }} \
      --timeout=300s
  displayName: 'Verify Rollout Status'

- script: |
    kubectl get pods \
      --namespace ${{ parameters.aksNamespace }} \
      --selector app.kubernetes.io/name=billingservice \
      --output wide
  displayName: 'Show Deployed Pods'
