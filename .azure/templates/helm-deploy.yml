# Reusable Helm deploy step template
# Parameters:
#   aksServiceConnection  — Azure DevOps service connection to the AKS cluster
#   environment           — deployment environment label (qa / staging / production)
#   imageTag              — Docker image tag to deploy
#   keyVaultUri           — Key Vault URI injected into the pod via environment variable
#   valuesFile            — Helm values override file to apply (e.g. values-mid.yaml)

parameters:
  - name: aksServiceConnection
    type: string
  - name: environment
    type: string
  - name: imageTag
    type: string
  - name: keyVaultUri
    type: string
  - name: valuesFile
    type: string
    default: 'values.yaml'

steps:
  - task: HelmInstaller@1
    displayName: 'Install Helm'
    inputs:
      helmVersionToInstall: latest

  - task: AzureCLI@2
    displayName: 'AKS credentials'
    inputs:
      azureSubscription: '${{ parameters.aksServiceConnection }}'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials \
          --resource-group $(AKS_RG_${{ upper(parameters.environment) }}) \
          --name $(AKS_CLUSTER_${{ upper(parameters.environment) }}) \
          --overwrite-existing

  - task: AzureCLI@2
    displayName: 'Helm upgrade — ${{ parameters.environment }}'
    inputs:
      azureSubscription: '${{ parameters.aksServiceConnection }}'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        helm upgrade billingservice $(helmChartPath) \
          --install \
          --namespace $(k8sNamespace) \
          --create-namespace \
          --values $(helmChartPath)/${{ parameters.valuesFile }} \
          --set image.repository=$(CONTAINER_REGISTRY)/$(imageRepository) \
          --set image.tag=${{ parameters.imageTag }} \
          --set keyVaultUri=${{ parameters.keyVaultUri }} \
          --set modernization.enableCleanArchitectureAdapters=true \
          --atomic \
          --timeout 5m \
          --wait

  - task: AzureCLI@2
    displayName: 'Verify rollout — ${{ parameters.environment }}'
    inputs:
      azureSubscription: '${{ parameters.aksServiceConnection }}'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        kubectl rollout status deployment/billingservice-web \
          --namespace $(k8sNamespace) \
          --timeout=300s
