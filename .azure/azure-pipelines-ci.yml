# BillingService CI Pipeline
# Runs on every PR and push to main. Builds, tests, and publishes the Docker image.
# Non-breaking: does not deploy automatically. Deployment is triggered by azure-pipelines-cd.yml.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Rethink.Services.Common/**
      - Microservices/Authentication/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Rethink.Services.Common/**
      - Microservices/Authentication/**

variables:
  dockerfilePath: 'docker/BillingService.Web.Dockerfile'
  imageRepository: 'rtabilling/billingserviceweb'
  containerRegistry: '$(CONTAINER_REGISTRY)'   # Set in variable group: billing-global
  tag: '$(Build.BuildId)'
  dotnetSdkVersion: '8.x'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test, and Publish Artifacts'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate NuGet feeds'

          - script: dotnet restore Microservices/Microservices.sln
            displayName: 'Restore NuGet packages'

          - script: >
              dotnet build Microservices/Microservices.sln
              --no-restore
              --configuration Release
            displayName: 'Build solution'

          - script: >
              dotnet test Microservices/BillingService.Web.XUnit.Tests
              --no-build
              --configuration Release
              --logger trx
              --results-directory $(Agent.TempDirectory)/TestResults
              /p:CollectCoverage=true
              /p:CoverletOutputFormat=cobertura
              /p:CoverletOutput=$(Agent.TempDirectory)/coverage/
            displayName: 'Run unit tests'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/coverage/coverage.cobertura.xml'

  - stage: Docker
    displayName: 'Build and Push Docker Image'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DockerBuildPush
        displayName: 'Build and Push'
        steps:
          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              containerRegistry: $(containerRegistry)
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: Microservices
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: 'Push Docker image'
            inputs:
              command: push
              containerRegistry: $(containerRegistry)
              repository: $(imageRepository)
              tags: |
                $(tag)
                latest

          - task: PublishPipelineArtifact@1
            displayName: 'Publish image tag artifact'
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: image-tag
              publishLocation: pipeline

          - script: echo "##vso[task.setvariable variable=imageTag;isOutput=true]$(tag)"
            name: setTag
            displayName: 'Export image tag for CD pipeline'
