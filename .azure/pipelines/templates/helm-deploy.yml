# Reusable template: Helm rolling deploy to AKS.
# Called by billing-cd.yml for each environment stage.

parameters:
  - name: environment
    type: string
  - name: imageTag
    type: string
  - name: aksServiceConnection
    type: string
  - name: aksResourceGroup
    type: string
  - name: aksCluster
    type: string
  - name: helmValuesFile
    type: string
    default: values.yaml

steps:
  - checkout: self

  - task: KubernetesManifest@1
    displayName: Create billing namespace (idempotent)
    inputs:
      action: deploy
      connectionType: azureResourceManager
      azureSubscriptionConnection: $(AZURE_SUBSCRIPTION_CONNECTION)
      azureResourceGroup: ${{ parameters.aksResourceGroup }}
      kubernetesCluster: ${{ parameters.aksCluster }}
      manifests: k8s/billingservice/namespace.yaml

  - task: HelmDeploy@0
    displayName: Helm upgrade — ${{ parameters.environment }}
    inputs:
      connectionType: Azure Resource Manager
      azureSubscription: $(AZURE_SUBSCRIPTION_CONNECTION)
      azureResourceGroup: ${{ parameters.aksResourceGroup }}
      kubernetesCluster: ${{ parameters.aksCluster }
      namespace: billing
      command: upgrade
      chartType: filepath
      chartPath: helm/billingservice
      releaseName: billingservice-${{ parameters.environment }}
      valueFile: helm/billingservice/${{ parameters.helmValuesFile }}
      overrideValues: >
        image.tag=${{ parameters.imageTag }},
        image.repository=$(containerRegistry)/$(imageRepository),
        environment=${{ parameters.environment }}
      waitForExecution: true
      arguments: --atomic --timeout 10m --history-max 5

  - task: Kubernetes@1
    displayName: Verify rollout — ${{ parameters.environment }}
    inputs:
      connectionType: Azure Resource Manager
      azureSubscriptionEndpoint: $(AZURE_SUBSCRIPTION_CONNECTION)
      azureResourceGroup: ${{ parameters.aksResourceGroup }}
      kubernetesCluster: ${{ parameters.aksCluster }}
      namespace: billing
      command: rollout
      arguments: status deployment/billingservice --timeout=300s
