# BillingService Azure DevOps CI/CD Pipeline
#
# Targets:
#   - QA:         automatic on push to main
#   - Staging:    automatic on QA success + manual gate
#   - Production: manual approval gate required
#
# Strategy:
#   - Builds Docker image with private NuGet feed
#   - Runs unit and integration tests with code coverage
#   - Pushes versioned image to Azure Container Registry
#   - Deploys via Helm rolling update to AKS (zero downtime)
#   - Supports rollback to previous Helm revision on failure

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**
      - helm/billingservice/**
      - k8s/billingservice/**
      - scripts/sql/billingservice/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**

variables:
  # Container registry
  acrName: myacr
  acrLoginServer: myacr.azurecr.io
  imageRepository: rtabilling/billingserviceweb
  dockerfilePath: Microservices/BillingService/BillingService.Web/Dockerfile
  dockerBuildContext: .

  # Helm / Kubernetes
  helmReleaseName: billingservice
  helmChartPath: helm/billingservice
  k8sNamespace: billing

  # Build
  buildConfiguration: Release
  dotnetVersion: '8.x'

  # Image tag: build ID ensures immutable, traceable images
  imageTag: $(Build.BuildId)

stages:

# ─────────────────────────────────────────────
# Stage 1: Build, Test, Publish Image
# ─────────────────────────────────────────────
- stage: Build
  displayName: Build and Test
  jobs:
  - job: BuildAndTest
    displayName: Build, Test, and Push Image
    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        version: $(dotnetVersion)

    - task: AzureKeyVault@2
      displayName: Fetch Build Secrets from Key Vault
      inputs:
        azureSubscription: BillingService-ServiceConnection
        KeyVaultName: billing-kv-shared
        SecretsFilter: 'nuget-feed-access-token,acr-password'
        RunAsPreJob: true

    - script: |
        dotnet nuget add source \
          "https://rethinkfirst.pkgs.visualstudio.com/RethinkFirst/_packaging/RethinkBHFeed/nuget/v3/index.json" \
          -u any -p "$(nuget-feed-access-token)" --store-password-in-clear-text --name RethinkBHFeed
        dotnet nuget add source \
          "https://rethinkfirst.pkgs.visualstudio.com/RethinkFirst/_packaging/Rethink-Common/nuget/v3/index.json" \
          -u any -p "$(nuget-feed-access-token)" --store-password-in-clear-text --name RethinkCommon
      displayName: Add Private NuGet Feeds

    - task: DotNetCoreCLI@2
      displayName: Restore NuGet packages
      inputs:
        command: restore
        projects: Microservices/BillingService/BillingService.Web/BillingService.Web.csproj

    - task: DotNetCoreCLI@2
      displayName: Build BillingService
      inputs:
        command: build
        projects: Microservices/BillingService/BillingService.Web/BillingService.Web.csproj
        arguments: -c $(buildConfiguration) --no-restore

    - task: DotNetCoreCLI@2
      displayName: Run Architecture Unit Tests
      inputs:
        command: test
        projects: Microservices/Test/BillingServiceTests/BillingService.Architecture.XUnit.Tests/BillingService.Architecture.XUnit.Tests.csproj
        arguments: >
          -c $(buildConfiguration)
          --collect:"XPlat Code Coverage"
          --settings Microservices/Test/BillingServiceTests/coverlet.runsettings
          --logger trx
          --results-directory $(Agent.TempDirectory)/testresults

    - task: DotNetCoreCLI@2
      displayName: Run BillingService Unit Tests
      inputs:
        command: test
        projects: Microservices/Test/BillingServiceTests/BillingService.XUnit.Tests/BillingService.XUnit.Tests/BillingService.XUnit.Tests.csproj
        arguments: >
          -c $(buildConfiguration)
          --collect:"XPlat Code Coverage"
          --settings Microservices/Test/BillingServiceTests/coverlet.runsettings
          --logger trx
          --results-directory $(Agent.TempDirectory)/testresults

    - task: DotNetCoreCLI@2
      displayName: Run Integration Tests
      inputs:
        command: test
        projects: Microservices/Test/BillingServiceTests/BillingService.XUnit.Integration.Tests/BillingService.XUnit.Integration.Tests.csproj
        arguments: >
          -c $(buildConfiguration)
          --collect:"XPlat Code Coverage"
          --settings Microservices/Test/BillingServiceTests/coverlet.runsettings
          --logger trx
          --results-directory $(Agent.TempDirectory)/testresults

    - task: PublishTestResults@2
      displayName: Publish Test Results
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/testresults/**/*.trx'
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: Publish Code Coverage
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/testresults/**/*.cobertura.xml'

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: BillingService-ACR-ServiceConnection
        repository: $(imageRepository)
        command: buildAndPush
        Dockerfile: $(dockerfilePath)
        buildContext: $(dockerBuildContext)
        tags: |
          $(imageTag)
          latest
        arguments: --build-arg ACCESS_TOKEN=$(nuget-feed-access-token) --build-arg ENVIRONMENT=Production

    - task: PublishPipelineArtifact@1
      displayName: Publish Helm Chart Artifact
      inputs:
        targetPath: $(helmChartPath)
        artifact: helm-chart

    - task: PublishPipelineArtifact@1
      displayName: Publish SQL Scripts Artifact
      inputs:
        targetPath: scripts/sql/billingservice
        artifact: sql-scripts

# ─────────────────────────────────────────────
# Stage 2: Deploy to QA
# ─────────────────────────────────────────────
- stage: DeployQA
  displayName: Deploy to QA
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    environment: qa

  jobs:
  - deployment: DeployToQA
    displayName: Helm Deploy to QA AKS
    pool:
      vmImage: ubuntu-latest
    environment: BillingService-QA
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: helm-chart

          - task: HelmDeploy@0
            displayName: Helm Upgrade (QA)
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: BillingService-ServiceConnection
              azureResourceGroup: rg-billing-qa
              kubernetesCluster: aks-billing-qa
              namespace: $(k8sNamespace)
              command: upgrade
              chartType: FilePath
              chartPath: $(Pipeline.Workspace)/helm-chart
              releaseName: $(helmReleaseName)
              valueFile: $(Pipeline.Workspace)/helm-chart/values.yaml
              overrideValues: >
                image.repository=$(acrLoginServer)/$(imageRepository),
                image.tag=$(imageTag),
                environment=qa,
                modernization.enableCleanArchitectureAdapters=true,
                modernization.enableDistributedCacheDecorators=false,
                modernization.enableOutboxPublisher=false
              install: true
              waitForExecution: true
              arguments: --timeout 5m0s --atomic

# ─────────────────────────────────────────────
# Stage 3: Deploy to Staging (manual gate)
# ─────────────────────────────────────────────
- stage: DeployStaging
  displayName: Deploy to Staging
  dependsOn: DeployQA
  condition: succeeded()
  variables:
    environment: staging

  jobs:
  - deployment: DeployToStaging
    displayName: Helm Deploy to Staging AKS
    pool:
      vmImage: ubuntu-latest
    environment: BillingService-Staging
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: helm-chart

          - task: HelmDeploy@0
            displayName: Helm Upgrade (Staging)
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: BillingService-ServiceConnection
              azureResourceGroup: rg-billing-staging
              kubernetesCluster: aks-billing-staging
              namespace: $(k8sNamespace)
              command: upgrade
              chartType: FilePath
              chartPath: $(Pipeline.Workspace)/helm-chart
              releaseName: $(helmReleaseName)
              valueFile: $(Pipeline.Workspace)/helm-chart/values-mid.yaml
              overrideValues: >
                image.repository=$(acrLoginServer)/$(imageRepository),
                image.tag=$(imageTag),
                environment=staging
              install: true
              waitForExecution: true
              arguments: --timeout 5m0s --atomic

# ─────────────────────────────────────────────
# Stage 4: Deploy to Production (manual gate)
# ─────────────────────────────────────────────
- stage: DeployProduction
  displayName: Deploy to Production
  dependsOn: DeployStaging
  condition: succeeded()
  variables:
    environment: production

  jobs:
  - deployment: DeployToProduction
    displayName: Helm Deploy to Production AKS
    pool:
      vmImage: ubuntu-latest
    environment: BillingService-Production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: helm-chart

          - task: HelmDeploy@0
            displayName: Helm Upgrade (Production)
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: BillingService-ServiceConnection
              azureResourceGroup: rg-billing-prod
              kubernetesCluster: aks-billing-prod
              namespace: $(k8sNamespace)
              command: upgrade
              chartType: FilePath
              chartPath: $(Pipeline.Workspace)/helm-chart
              releaseName: $(helmReleaseName)
              valueFile: $(Pipeline.Workspace)/helm-chart/values-enterprise.yaml
              overrideValues: >
                image.repository=$(acrLoginServer)/$(imageRepository),
                image.tag=$(imageTag),
                environment=production
              install: true
              waitForExecution: true
              arguments: --timeout 8m0s --atomic

          - script: |
              echo "##[section]Production deployment complete"
              echo "Image: $(acrLoginServer)/$(imageRepository):$(imageTag)"
              echo "Helm release: $(helmReleaseName) in namespace $(k8sNamespace)"
            displayName: Deployment Summary
