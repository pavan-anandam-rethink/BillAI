trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Rethink.Services.Common/**
      - Microservices/Authentication/**
      - scripts/sql/billingservice/**
      - k8s/billingservice/**
      - helm/billingservice/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Rethink.Services.Common/**
      - Microservices/Authentication/**
      - scripts/sql/billingservice/**
      - k8s/billingservice/**
      - helm/billingservice/**

variables:
  - name: buildConfiguration
    value: Release
  - name: dotnetVersion
    value: '8.x'
  - name: acrName
    value: 'myacr'
  - name: imageRepository
    value: 'rtabilling/billingserviceweb'
  - name: containerRegistry
    value: '$(acrName).azurecr.io'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: testResultsDirectory
    value: '$(Agent.TempDirectory)/testresults'
  - name: solutionFile
    value: 'Microservices/Microservices.sln'
  - group: billingservice-secrets  # Pipeline variable group for ACCESS_TOKEN, etc.

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ─────────────────────────────────────────────────────────────────────────── #
  # STAGE 1 — BUILD AND TEST                                                    #
  # ─────────────────────────────────────────────────────────────────────────── #
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
      - job: Build
        displayName: 'Restore · Build · Test'
        timeoutInMinutes: 30
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)
              performMultiLevelLookup: true

          - script: |
              dotnet nuget add source \
                https://rethinkfirst.pkgs.visualstudio.com/RethinkFirst/_packaging/RethinkBHFeed/nuget/v3/index.json \
                -u any -p "$(ACCESS_TOKEN)" --store-password-in-clear-text --name RethinkBHFeed || true
              dotnet nuget add source \
                https://rethinkfirst.pkgs.visualstudio.com/RethinkFirst/_packaging/Rethink-Common/nuget/v3/index.json \
                -u any -p "$(ACCESS_TOKEN)" --store-password-in-clear-text --name RethinkCommon || true
            displayName: 'Configure NuGet feeds'

          - task: DotNetCoreCLI@2
            displayName: 'Restore packages'
            inputs:
              command: restore
              projects: '$(solutionFile)'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution'
            inputs:
              command: build
              projects: '$(solutionFile)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Unit tests — Architecture'
            inputs:
              command: test
              projects: 'Microservices/Test/BillingServiceTests/BillingService.Architecture.XUnit.Tests/BillingService.Architecture.XUnit.Tests.csproj'
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --collect:"XPlat Code Coverage"
                --settings Microservices/Test/BillingServiceTests/coverlet.runsettings
                --logger trx
                --results-directory $(testResultsDirectory)

          - task: DotNetCoreCLI@2
            displayName: 'Unit tests — Web Controllers'
            inputs:
              command: test
              projects: 'Microservices/Test/BillingServiceTests/BillingService.Web.XUnit.Tests/BillingService.Web.XUnit.Tests.csproj'
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --collect:"XPlat Code Coverage"
                --settings Microservices/Test/BillingServiceTests/coverlet.runsettings
                --logger trx
                --results-directory $(testResultsDirectory)
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(testResultsDirectory)/**/*.trx'
              failTaskOnFailedTests: true
              publishRunAttachments: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: always()
            inputs:
              summaryFileLocation: '$(testResultsDirectory)/**/coverage.cobertura.xml'

  # ─────────────────────────────────────────────────────────────────────────── #
  # STAGE 2 — DOCKER BUILD AND PUSH (main / release branches only)             #
  # ─────────────────────────────────────────────────────────────────────────── #
  - stage: DockerBuildPush
    displayName: 'Docker Build and Push'
    dependsOn: BuildAndTest
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Docker
        displayName: 'Build and push image'
        timeoutInMinutes: 30
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'AcrServiceConnection'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: '$(containerRegistry)/$(imageRepository)'
              dockerfile: 'Microservices/BillingService/BillingService.Web/Dockerfile'
              buildContext: '.'
              arguments: '--build-arg ACCESS_TOKEN=$(ACCESS_TOKEN) --build-arg ENVIRONMENT=$(buildConfiguration)'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Push Docker image'
            inputs:
              command: push
              repository: '$(containerRegistry)/$(imageRepository)'
              tags: |
                $(imageTag)
                latest

          - task: PublishPipelineArtifact@1
            displayName: 'Publish image tag artifact'
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifactName: image-metadata
              publishLocation: pipeline

  # ─────────────────────────────────────────────────────────────────────────── #
  # STAGE 3 — DEPLOY TO QA                                                      #
  # ─────────────────────────────────────────────────────────────────────────── #
  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: DockerBuildPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - name: aksNamespace
        value: billing-qa
      - name: helmRelease
        value: billingservice-qa
    jobs:
      - deployment: DeployToQA
        displayName: 'Helm upgrade to QA AKS'
        environment: 'BillingService-QA'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  displayName: 'Apply namespace'
                  inputs:
                    action: deploy
                    connectionType: azureResourceManager
                    azureSubscriptionConnection: 'AzureServiceConnection'
                    azureResourceGroup: 'rethink-aks-rg'
                    kubernetesCluster: 'rethink-aks'
                    namespace: '$(aksNamespace)'
                    manifests: 'k8s/billingservice/namespace.yaml'

                - task: HelmDeploy@1
                  displayName: 'Helm upgrade BillingService (QA)'
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscription: 'AzureServiceConnection'
                    azureResourceGroup: 'rethink-aks-rg'
                    kubernetesCluster: 'rethink-aks'
                    namespace: '$(aksNamespace)'
                    command: upgrade
                    chartType: FilePath
                    chartPath: 'helm/billingservice'
                    releaseName: '$(helmRelease)'
                    overrideValues: |
                      image.tag=$(imageTag)
                    valueFile: 'helm/billingservice/values.yaml'
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 10m0s --atomic'

  # ─────────────────────────────────────────────────────────────────────────── #
  # STAGE 4 — DEPLOY TO STAGING (manual approval gate)                         #
  # ─────────────────────────────────────────────────────────────────────────── #
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployQA
    condition: succeeded()
    variables:
      - name: aksNamespace
        value: billing-staging
      - name: helmRelease
        value: billingservice-staging
    jobs:
      - deployment: DeployToStaging
        displayName: 'Helm upgrade to Staging AKS'
        environment: 'BillingService-Staging'   # Approval gate configured in Environments UI
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmDeploy@1
                  displayName: 'Helm upgrade BillingService (Staging)'
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscription: 'AzureServiceConnection'
                    azureResourceGroup: 'rethink-aks-rg'
                    kubernetesCluster: 'rethink-aks'
                    namespace: '$(aksNamespace)'
                    command: upgrade
                    chartType: FilePath
                    chartPath: 'helm/billingservice'
                    releaseName: '$(helmRelease)'
                    overrideValues: |
                      image.tag=$(imageTag)
                    valueFile: 'helm/billingservice/values-mid.yaml'
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 10m0s --atomic'

  # ─────────────────────────────────────────────────────────────────────────── #
  # STAGE 5 — DEPLOY TO PRODUCTION (manual approval gate)                      #
  # ─────────────────────────────────────────────────────────────────────────── #
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    condition: succeeded()
    variables:
      - name: aksNamespace
        value: billing
      - name: helmRelease
        value: billingservice
    jobs:
      - deployment: DeployToProduction
        displayName: 'Helm upgrade to Production AKS'
        environment: 'BillingService-Production'   # Approval gate configured in Environments UI
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmDeploy@1
                  displayName: 'Helm upgrade BillingService (Production)'
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscription: 'AzureServiceConnection'
                    azureResourceGroup: 'rethink-aks-rg'
                    kubernetesCluster: 'rethink-aks'
                    namespace: '$(aksNamespace)'
                    command: upgrade
                    chartType: FilePath
                    chartPath: 'helm/billingservice'
                    releaseName: '$(helmRelease)'
                    overrideValues: |
                      image.tag=$(imageTag)
                    valueFile: 'helm/billingservice/values-enterprise.yaml'
                    install: true
                    waitForExecution: true
                    arguments: '--timeout 15m0s --atomic'
