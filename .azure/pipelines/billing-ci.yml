# BillingService CI pipeline
# Triggers on every push to main or any feature branch.
# Validates build, runs unit tests, publishes test results and code coverage.

trigger:
  branches:
    include:
      - main
      - feature/*
      - bugfix/*
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Rethink.Services.Common/**
      - Microservices/Authentication/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'
  projectPath: 'Microservices/BillingService/BillingService.Web/BillingService.Web.csproj'
  testResultsDir: '$(Agent.TempDirectory)/TestResults'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Build, Test, and Publish
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: Restore NuGet packages
            inputs:
              command: restore
              projects: 'Microservices/Microservices.sln'
              feedsToUse: config
              nugetConfigPath: 'Microservices/nuget.config'

          - task: DotNetCoreCLI@2
            displayName: Build solution
            inputs:
              command: build
              projects: 'Microservices/Microservices.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: Run unit tests
            inputs:
              command: test
              projects: |
                Microservices/BillingService.Web.XUnit.Tests/**/*.csproj
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --logger trx
                --results-directory $(testResultsDir)
                --collect:"XPlat Code Coverage"
              publishTestResults: false

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(testResultsDir)/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: always()
            inputs:
              summaryFileLocation: '$(testResultsDir)/**/coverage.cobertura.xml'

          - task: DotNetCoreCLI@2
            displayName: Publish BillingService.Web
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(projectPath)
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --output $(Build.ArtifactStagingDirectory)/billingservice

          - task: PublishBuildArtifacts@1
            displayName: Publish build artifact
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/billingservice
              ArtifactName: billingservice-drop
