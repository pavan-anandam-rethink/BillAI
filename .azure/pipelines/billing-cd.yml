# BillingService CD pipeline
# Deploys the Docker image produced by the CI pipeline to AKS across QA → Staging → Production.
# Each environment beyond QA requires a manual approval gate.

trigger: none

resources:
  pipelines:
    - pipeline: billingCi
      source: BillingService-CI
      trigger:
        branches:
          include:
            - main

variables:
  imageRepository: 'billingservice'
  containerRegistry: '$(ACR_NAME).azurecr.io'
  helmChartPath: 'helm/billingservice'
  k8sNamespace: 'billing'
  dockerfilePath: 'docker/BillingService.Web.Dockerfile'

stages:
  # ──────────────────────────────────────────────────────────────────────────
  - stage: BuildImage
    displayName: Build and Push Docker Image
    jobs:
      - job: DockerBuildPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build Docker image
            inputs:
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: $(imageRepository)
              command: build
              dockerfile: $(dockerfilePath)
              buildContext: Microservices
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: Push Docker image
            inputs:
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: $(imageRepository)
              command: push
              tags: |
                $(Build.BuildId)
                latest

  # ──────────────────────────────────────────────────────────────────────────
  - stage: DeployQA
    displayName: Deploy to QA
    dependsOn: BuildImage
    variables:
      environment: qa
      aksServiceConnection: $(AKS_QA_SERVICE_CONNECTION)
      aksResourceGroup: $(AKS_QA_RESOURCE_GROUP)
      aksCluster: $(AKS_QA_CLUSTER)
    jobs:
      - deployment: DeployToQA
        environment: billing-qa
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    environment: $(environment)
                    imageTag: $(Build.BuildId)
                    aksServiceConnection: $(aksServiceConnection)
                    aksResourceGroup: $(aksResourceGroup)
                    aksCluster: $(aksCluster)
                    helmValuesFile: values-initial.yaml

  # ──────────────────────────────────────────────────────────────────────────
  - stage: DeployStaging
    displayName: Deploy to Staging
    dependsOn: DeployQA
    variables:
      environment: staging
      aksServiceConnection: $(AKS_STAGING_SERVICE_CONNECTION)
      aksResourceGroup: $(AKS_STAGING_RESOURCE_GROUP)
      aksCluster: $(AKS_STAGING_CLUSTER)
    jobs:
      - deployment: DeployToStaging
        environment: billing-staging
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    environment: $(environment)
                    imageTag: $(Build.BuildId)
                    aksServiceConnection: $(aksServiceConnection)
                    aksResourceGroup: $(aksResourceGroup)
                    aksCluster: $(aksCluster)
                    helmValuesFile: values-mid.yaml

  # ──────────────────────────────────────────────────────────────────────────
  - stage: DeployProduction
    displayName: Deploy to Production
    dependsOn: DeployStaging
    variables:
      environment: production
      aksServiceConnection: $(AKS_PROD_SERVICE_CONNECTION)
      aksResourceGroup: $(AKS_PROD_RESOURCE_GROUP)
      aksCluster: $(AKS_PROD_CLUSTER)
    jobs:
      - deployment: DeployToProduction
        environment: billing-production
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    environment: $(environment)
                    imageTag: $(Build.BuildId)
                    aksServiceConnection: $(aksServiceConnection)
                    aksResourceGroup: $(aksResourceGroup)
                    aksCluster: $(aksCluster)
                    helmValuesFile: values-enterprise.yaml
