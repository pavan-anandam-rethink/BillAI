# BillingService CD Pipeline
# Triggered by successful CI on main. Deploys to QA, then Staging (auto-approve),
# then Production (manual approval gate).
# Zero-downtime rolling deployments via Helm and AKS.

trigger: none   # CD is triggered by successful CI pipeline completion

resources:
  pipelines:
    - pipeline: ci
      source: 'BillingService-CI'
      trigger:
        branches:
          include:
            - main

variables:
  - group: billing-global        # CONTAINER_REGISTRY, ACR_SERVICE_CONNECTION
  - group: billing-keyvault      # KEY_VAULT_URI per environment
  imageRepository: 'rtabilling/billingserviceweb'
  helmChartPath: 'helm/billingservice'
  k8sNamespace: 'billing'
  dotnetSdkVersion: '8.x'

pool:
  vmImage: ubuntu-latest

stages:

  # ─── QA ────────────────────────────────────────────────────────────────────
  - stage: DeployQA
    displayName: 'Deploy to QA'
    variables:
      - group: billing-qa          # AKS_SERVICE_CONNECTION_QA, KEY_VAULT_URI_QA
    jobs:
      - deployment: HelmDeployQA
        displayName: 'Helm upgrade — QA'
        environment: billing-qa
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    aksServiceConnection: '$(AKS_SERVICE_CONNECTION_QA)'
                    environment: qa
                    imageTag: $(resources.pipeline.ci.runID)
                    keyVaultUri: '$(KEY_VAULT_URI_QA)'
                    valuesFile: 'values-initial.yaml'

  # ─── Staging ───────────────────────────────────────────────────────────────
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployQA
    condition: succeeded()
    variables:
      - group: billing-staging     # AKS_SERVICE_CONNECTION_STAGING, KEY_VAULT_URI_STAGING
    jobs:
      - deployment: HelmDeployStaging
        displayName: 'Helm upgrade — Staging'
        environment: billing-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    aksServiceConnection: '$(AKS_SERVICE_CONNECTION_STAGING)'
                    environment: staging
                    imageTag: $(resources.pipeline.ci.runID)
                    keyVaultUri: '$(KEY_VAULT_URI_STAGING)'
                    valuesFile: 'values-mid.yaml'

  # ─── Production ────────────────────────────────────────────────────────────
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    condition: succeeded()
    variables:
      - group: billing-prod        # AKS_SERVICE_CONNECTION_PROD, KEY_VAULT_URI_PROD
    jobs:
      - job: ApprovalGate
        displayName: 'Production approval gate'
        pool: server
        timeoutInMinutes: 4320     # 3-day approval window
        steps:
          - task: ManualValidation@0
            displayName: 'Approve production deployment'
            inputs:
              notifyUsers: '$(PROD_APPROVERS)'
              instructions: |
                Review QA and Staging deployment results, smoke test reports,
                and load-test dashboards before approving production rollout.
              onTimeout: reject

      - deployment: HelmDeployProduction
        displayName: 'Helm upgrade — Production'
        dependsOn: ApprovalGate
        environment: billing-production
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/helm-deploy.yml
                  parameters:
                    aksServiceConnection: '$(AKS_SERVICE_CONNECTION_PROD)'
                    environment: production
                    imageTag: $(resources.pipeline.ci.runID)
                    keyVaultUri: '$(KEY_VAULT_URI_PROD)'
                    valuesFile: 'values-enterprise.yaml'

      - job: RollbackCapability
        displayName: 'Record rollback revision'
        dependsOn: HelmDeployProduction
        steps:
          - task: AzureCLI@2
            displayName: 'Record Helm history for rollback'
            inputs:
              azureSubscription: '$(AKS_SERVICE_CONNECTION_PROD)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials --resource-group $(AKS_RG_PROD) --name $(AKS_CLUSTER_PROD) --overwrite-existing
                helm history billingservice -n billing --max 5
