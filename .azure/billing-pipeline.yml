# ============================================================================
# Azure DevOps CI/CD Pipeline: BillingService Modernization
#
# Stages:
#   1. build-and-test   – restore, build, run architecture tests, helm lint
#   2. docker-build      – build and push Docker image to ACR (manual approval in non-PR runs)
#   3. deploy-qa         – deploy to QA namespace via Helm rolling update
#   4. deploy-staging    – deploy to Staging (manual approval gate)
#   5. deploy-production – deploy to Production (manual approval gate)
#
# Feature flags are injected per environment so that progressive enablement
# (distributed cache, event bus, outbox publisher) happens without code changes.
# ============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Test/BillingServiceTests/**
      - k8s/billingservice/**
      - helm/billingservice/**
      - scripts/sql/billingservice/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - Microservices/BillingService/**
      - Microservices/Test/BillingServiceTests/**
      - k8s/billingservice/**
      - helm/billingservice/**

variables:
  acrName: 'myacr.azurecr.io'
  imageRepository: 'rtabilling/billingserviceweb'
  dotnetVersion: '8.0.x'
  helmReleaseName: 'billingservice'
  aksNamespace: 'billing'
  buildConfiguration: 'Release'

pool:
  vmImage: 'ubuntu-latest'

stages:

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1 – Build and Test
  # ──────────────────────────────────────────────────────────────────────────
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
      - job: Build
        displayName: 'Restore · Build · Test · Lint'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate private NuGet feeds'

          - script: |
              dotnet restore Microservices/BillingService/BillingService.Infrastructure/BillingService.Infrastructure.csproj
              dotnet restore Microservices/BillingService/BillingService.Workers/BillingService.Workers.csproj
              dotnet restore Microservices/BillingService/BillingService.Persistence/BillingService.Persistence.csproj
              dotnet restore Microservices/BillingService/BillingService.LegacyAdapters/BillingService.LegacyAdapters.csproj
              dotnet restore Microservices/Test/BillingServiceTests/BillingService.Architecture.XUnit.Tests/BillingService.Architecture.XUnit.Tests.csproj
            displayName: 'Restore NuGet packages'

          - script: |
              dotnet build Microservices/BillingService/BillingService.Infrastructure/BillingService.Infrastructure.csproj --configuration $(buildConfiguration) --no-restore
              dotnet build Microservices/BillingService/BillingService.Workers/BillingService.Workers.csproj --configuration $(buildConfiguration) --no-restore
              dotnet build Microservices/BillingService/BillingService.Persistence/BillingService.Persistence.csproj --configuration $(buildConfiguration) --no-restore
              dotnet build Microservices/BillingService/BillingService.LegacyAdapters/BillingService.LegacyAdapters.csproj --configuration $(buildConfiguration) --no-restore
            displayName: 'Build modernization layers'

          - script: |
              dotnet test \
                Microservices/Test/BillingServiceTests/BillingService.Architecture.XUnit.Tests/BillingService.Architecture.XUnit.Tests.csproj \
                --configuration $(buildConfiguration) \
                --no-restore \
                --logger trx \
                --results-directory $(Agent.TempDirectory)/TestResults
            displayName: 'Run architecture unit tests'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
            condition: always()

          - task: HelmInstaller@1
            displayName: 'Install Helm'
            inputs:
              helmVersionToInstall: 'latest'

          - script: helm lint helm/billingservice
            displayName: 'Helm chart lint'

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2 – Docker Build and Push
  # Skipped for pull requests; runs on push to main after tests pass.
  # ──────────────────────────────────────────────────────────────────────────
  - stage: DockerBuild
    displayName: 'Docker Build and Push'
    dependsOn: BuildAndTest
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DockerBuildPush
        displayName: 'Build image and push to ACR'
        steps:
          - task: NuGetAuthenticate@1
            displayName: 'Authenticate private NuGet feeds'

          - task: AzureCLI@2
            displayName: 'ACR login'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az acr login --name $(acrName)

          - task: Docker@2
            displayName: 'Build and push Docker image'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: Microservices/BillingService/BillingService.Web/Dockerfile
              buildContext: Microservices
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest
              arguments: >
                --build-arg ACCESS_TOKEN=$(nugetAccessToken)
                --build-arg ENVIRONMENT=production

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 3 – Deploy to QA
  # ──────────────────────────────────────────────────────────────────────────
  - stage: DeployQA
    displayName: 'Deploy to QA'
    dependsOn: DockerBuild
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployQA
        displayName: 'Helm rolling update — QA'
        environment: 'billing-qa'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                - script: |
                    helm upgrade --install $(helmReleaseName) helm/billingservice \
                      --namespace $(aksNamespace)-qa \
                      --create-namespace \
                      --values helm/billingservice/values-initial.yaml \
                      --set image.tag=$(Build.BuildId) \
                      --set modernization.enableCleanArchitectureAdapters=true \
                      --set modernization.enableDistributedCacheDecorators=false \
                      --set modernization.enableOutboxPublisher=false \
                      --wait \
                      --timeout 5m
                  displayName: 'Helm deploy QA'

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 4 – Deploy to Staging (manual approval gate)
  # ──────────────────────────────────────────────────────────────────────────
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployQA
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        displayName: 'Helm rolling update — Staging'
        environment: 'billing-staging'    # Configured with manual approval in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                - script: |
                    helm upgrade --install $(helmReleaseName) helm/billingservice \
                      --namespace $(aksNamespace)-staging \
                      --create-namespace \
                      --values helm/billingservice/values-mid.yaml \
                      --set image.tag=$(Build.BuildId) \
                      --set modernization.enableCleanArchitectureAdapters=true \
                      --set modernization.enableDistributedCacheDecorators=true \
                      --set modernization.enableOutboxPublisher=false \
                      --wait \
                      --timeout 5m
                  displayName: 'Helm deploy Staging'

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 5 – Deploy to Production (manual approval gate)
  # ──────────────────────────────────────────────────────────────────────────
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: 'Helm rolling update — Production'
        environment: 'billing-production'   # Configured with manual approval + required reviewers
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(aksResourceGroup) \
                        --name $(aksClusterName) \
                        --overwrite-existing

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                - script: |
                    helm upgrade --install $(helmReleaseName) helm/billingservice \
                      --namespace $(aksNamespace) \
                      --values helm/billingservice/values-enterprise.yaml \
                      --set image.tag=$(Build.BuildId) \
                      --set modernization.enableCleanArchitectureAdapters=true \
                      --set modernization.enableDistributedCacheDecorators=true \
                      --set modernization.enableOutboxPublisher=true \
                      --wait \
                      --timeout 10m
                  displayName: 'Helm deploy Production (rolling, zero downtime)'

                - script: |
                    echo "Verifying rollout..."
                    kubectl rollout status deployment/billingservice-web \
                      --namespace $(aksNamespace) \
                      --timeout=5m
                    echo "Rollout complete."
                  displayName: 'Verify rollout'
