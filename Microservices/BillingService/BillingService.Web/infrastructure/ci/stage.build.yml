parameters:
 - name: ContainerTestFolder
   type: string
 - name: DependsOn
   type: object
   default: []
 - name: env
   type: string
   default: dev

stages:
  # ─── Build, Test, and Push ────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build · Test · Push'
    dependsOn: ${{ parameters.DependsOn }}
    jobs:
      - job: Build
        displayName: 'Docker Build / Test / Push'
        steps:
          - script: |
              pwd && ls -lrt
              echo $(password) | docker login --username $(login) --password-stdin https://$(container)
              echo "Tag Build : $(TagBuild)"
              echo "Tag Latest: $(TagLatest)"
              docker build --no-cache \
                --build-arg ENVIRONMENT=$(Environment) \
                --build-arg ACCESS_TOKEN=$PAT \
                -f $(dockerfilePath) \
                -t $(TagBuild) -t $(TagLatest) .
              docker image tag $(TagBuild) $(container)/$(TagBuild)
              docker image tag $(TagBuild) $(container)/$(TagLatest)
              docker create -ti --name testcontainer $(TagBuild)
              docker cp testcontainer:${{ parameters.ContainerTestFolder }} $(Build.ArtifactStagingDirectory)/testresults
              docker cp testcontainer:/app/coveragereport/                  $(Build.ArtifactStagingDirectory)/coveragereport
            env:
              PAT: $(System.AccessToken)
            displayName: 'Build image, extract test results'

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Coverage'
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '$(Build.ArtifactStagingDirectory)/coveragereport/Cobertura.xml'
              reportDirectory:     '$(Build.ArtifactStagingDirectory)/coveragereport'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles:   '**/*.trx'
              searchFolder:       '$(Build.ArtifactStagingDirectory)/testresults'
              failTaskOnFailedTests: false

          - task: BuildQualityChecks@8
            displayName: 'Quality Gate'
            inputs:
              checkCoverage:      true
              coverageType:       lines
              coverageFailOption: fixed
              coverageThreshold:  1

          - script: |
              docker push $(container)/$(TagBuild)
              docker push $(container)/$(TagLatest)
            displayName: 'Push to ACR'

          # Publish Helm chart + k8s manifests as pipeline artifact for downstream deploy stages.
          - task: PublishPipelineArtifact@1
            displayName: 'Publish deploy manifests'
            inputs:
              artifactName: 'manifests'
              path: '$(Build.SourcesDirectory)/k8s/billingservice'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Helm chart'
            inputs:
              artifactName: 'helm-billingservice'
              path: '$(Build.SourcesDirectory)/helm/billingservice'

  # ─── Deploy to QA ─────────────────────────────────────────────────────────
  - stage: DeployQA
    displayName: 'Deploy → QA'
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.env }}', 'qa'))
    jobs:
      - deployment: DeployQA
        displayName: 'Helm upgrade – QA'
        environment: 'billing-qa'        # Azure DevOps Environment – no approval gate (auto-deploy)
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: helm-billingservice

                - task: HelmDeploy@0
                  displayName: 'helm upgrade billingservice – QA'
                  inputs:
                    connectionType:      'Kubernetes Service Connection'
                    kubernetesServiceConnection: '$(k8sServiceConnectionQA)'
                    namespace:           'billing'
                    command:             upgrade
                    chartType:           FilePath
                    chartPath:           '$(Pipeline.Workspace)/helm-billingservice'
                    releaseName:         'billingservice'
                    overrideValues: |
                      image.repository=$(container)/rtabilling/billingserviceweb
                      image.tag=$(Build.BuildNumber)
                      keyVaultUri=$(keyVaultUriQA)
                      workloadIdentityClientId=$(workloadIdentityClientIdQA)
                      modernization.enableCleanArchitectureAdapters=true
                      modernization.enableDistributedCacheDecorators=false
                      modernization.enableOutboxPublisher=false
                      modernization.enableReadModelQueries=false
                    valueFile: '$(Pipeline.Workspace)/helm-billingservice/values-initial.yaml'
                    waitForExecution: true
                    arguments: '--timeout 10m --atomic'

                - script: |
                    echo "Running smoke test against QA..."
                    curl -sf "$(qaApiBaseUrl)/api/health" | grep -q '"status"'
                  displayName: 'Smoke test – /api/health'

  # ─── Deploy to Staging (requires manual approval) ─────────────────────────
  - stage: DeployStaging
    displayName: 'Deploy → Staging'
    dependsOn: DeployQA
    condition: and(succeeded(), eq('${{ parameters.env }}', 'stg'))
    jobs:
      - deployment: DeployStaging
        displayName: 'Helm upgrade – Staging'
        environment: 'billing-staging'   # Configure approval gate in ADO Environments UI
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: helm-billingservice

                - task: HelmDeploy@0
                  displayName: 'helm upgrade billingservice – Staging'
                  inputs:
                    connectionType:      'Kubernetes Service Connection'
                    kubernetesServiceConnection: '$(k8sServiceConnectionStaging)'
                    namespace:           'billing'
                    command:             upgrade
                    chartType:           FilePath
                    chartPath:           '$(Pipeline.Workspace)/helm-billingservice'
                    releaseName:         'billingservice'
                    overrideValues: |
                      image.repository=$(container)/rtabilling/billingserviceweb
                      image.tag=$(Build.BuildNumber)
                      keyVaultUri=$(keyVaultUriStaging)
                      workloadIdentityClientId=$(workloadIdentityClientIdStaging)
                      modernization.enableCleanArchitectureAdapters=true
                      modernization.enableDistributedCacheDecorators=true
                      modernization.enableOutboxPublisher=false
                      modernization.enableReadModelQueries=false
                    valueFile: '$(Pipeline.Workspace)/helm-billingservice/values-mid.yaml'
                    waitForExecution: true
                    arguments: '--timeout 10m --atomic'

                - script: |
                    echo "Running smoke test against Staging..."
                    curl -sf "$(stagingApiBaseUrl)/api/health" | grep -q '"status"'
                  displayName: 'Smoke test – /api/health'

  # ─── Deploy to Production (requires manual approval) ──────────────────────
  - stage: DeployProduction
    displayName: 'Deploy → Production'
    dependsOn: DeployStaging
    condition: and(succeeded(), eq('${{ parameters.env }}', 'prd'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Helm upgrade – Production'
        environment: 'billing-production'  # Configure multi-approver gate in ADO Environments UI
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: helm-billingservice

                - task: HelmDeploy@0
                  displayName: 'helm upgrade billingservice – Production'
                  inputs:
                    connectionType:      'Kubernetes Service Connection'
                    kubernetesServiceConnection: '$(k8sServiceConnectionPrd)'
                    namespace:           'billing'
                    command:             upgrade
                    chartType:           FilePath
                    chartPath:           '$(Pipeline.Workspace)/helm-billingservice'
                    releaseName:         'billingservice'
                    overrideValues: |
                      image.repository=$(ACR)/rtabilling/billingserviceweb
                      image.tag=$(Build.BuildNumber)
                      keyVaultUri=$(keyVaultUriPrd)
                      workloadIdentityClientId=$(workloadIdentityClientIdPrd)
                      modernization.enableCleanArchitectureAdapters=true
                      modernization.enableDistributedCacheDecorators=true
                      modernization.enableOutboxPublisher=false
                      modernization.enableReadModelQueries=false
                    valueFile: '$(Pipeline.Workspace)/helm-billingservice/values-mid.yaml'
                    waitForExecution: true
                    # --atomic rolls back Helm release on failure; --timeout guards long-running upgrades.
                    arguments: '--timeout 15m --atomic'

                - script: |
                    echo "Running production smoke test..."
                    curl -sf "$(prdApiBaseUrl)/api/health" | grep -q '"status"'
                  displayName: 'Smoke test – /api/health'

  # ─── Rollback note ────────────────────────────────────────────────────────
  # To roll back production:
  #   helm rollback billingservice <revision> -n billing
  # Or re-run the pipeline with a previous Build.BuildNumber image tag.
